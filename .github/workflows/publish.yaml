name: Publish

# Inspired by: 
# https://dev.to/xcanchal/automatic-versioning-in-a-lerna-monorepo-using-github-actions-4hij
# Problems:
#   I tried to use github registry to publish public packages,
#   but packages in github require auth to install even if package is public.
#
#   Publishing uses npm trusted publishing (OIDC), no NPM_TOKEN secret.
#   Job needs id-token: write, trusted publisher is configured per package on npmjs.com
#   When publishing public package, publishConfig.access need to be configured on each package
#
#   Lerna need fetch-depth: 0 (full fetch) on checkout to be able generate full changelog 

on:
  pull_request:
    types: [closed]
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - name: "Checkout"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: "Setup Node"
      uses: actions/setup-node@v4
      with:
        node-version: '24.14.0'
        cache: 'yarn'

    - name: "Setup Deno"
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x
        cache: true

    - name: Install
      run: yarn install

    - name: Lint
      run: yarn run lint

    - name: Test
      run: yarn run test

    - name: Setup git user
      run: |
        echo "Setup git user to github action user"
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor}}@users.noreply.github.com"

    - name: Version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: yarn run version

    # lerna version tags HEAD only when it cut a release, merges without changes have no tag
    - name: Check release
      id: release
      run: |
        tag=$(git tag --points-at HEAD --list 'v*' | head -n 1)
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        if [ -z "$tag" ]; then echo "No new version, skipping build and publish"; fi

    - name: Build
      if: steps.release.outputs.tag != ''
      run: yarn run dist

    - name: Publish
      if: steps.release.outputs.tag != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        yarn run publish
