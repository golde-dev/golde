approvedGitRepositories:
  - "**"

compressionLevel: 2

enableGlobalCache: true

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 2d

npmPreapprovedPackages:
  - "@golde/*"

yarnPath: .yarn/releases/yarn-4.18.1.cjs

packageExtensions:
  # @napi-rs/wasm-runtime needs it as a peer; astro2tsx 0.1.3 only ships @emnapi/core
  "@astrojs/astro2tsx@*":
    dependencies:
      "@emnapi/runtime": 1.11.3
